<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>lukewm beverages</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f4f4f4;color:#333;}
header{background:linear-gradient(135deg,#111,#333);color:#fff;padding:40px;text-align:center;}
.container{width:90%;max-width:1200px;margin:auto;padding:40px 0;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;}
.product{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.product img{width:100%;height:220px;object-fit:cover;}
.product-info{padding:20px;}
button{background:#111;color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer;}
button:hover{background:#444;}
.checkout-box{background:#fff;padding:20px;border-radius:15px;margin-top:30px;}
.cart-item{display:flex;justify-content:space-between;padding:10px;background:#f8f8f8;margin-bottom:10px;border-radius:10px;}
#totalPrice{margin-top:10px;font-size:22px;color:green;}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;}
</style>

</head>
<body>

<header>
<h1>lukewarm beverages</h1>
<p>pls buy from me</p>
</header>

<div class="container">

<!-- AUTH -->
<div class="checkout-box">
<h2>Account</h2>

<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<p id="authStatus">Not logged in</p>
</div>

<!-- PRODUCTS -->
<h2>Products</h2>

<div class="products">

<div class="product">
<img src="https://via.placeholder.com/300" />
<div class="product-info">
<h3>Water</h3>
<p>$100</p>
<button onclick="addToCart('Water',100)">Add</button>
</div>
</div>

<div class="product">
<img src="https://via.placeholder.com/300" />
<div class="product-info">
<h3>Sports Drink</h3>
<p>$50</p>
<button onclick="addToCart('Sports Drink',50)">Add</button>
</div>
</div>

</div>

<!-- CART -->
<div class="checkout-box">
<h2>Cart</h2>
<div id="cartItems">Empty</div>
<h3 id="totalPrice">Total: $0</h3>
</div>

<!-- CHECKOUT -->
<div class="checkout-box">
<h2>Checkout</h2>

<form id="checkoutForm">
<input id="name" placeholder="Name" required>
<input id="email" placeholder="Email" required>
<input id="address" placeholder="Address" required>

<select id="payment" required>
<option value="">Payment</option>
<option>Card</option>
<option>Cash</option>
</select>

<textarea id="message" placeholder="Notes"></textarea>

<button type="submit">Place Order</button>
</form>

</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* ---------------- FIREBASE ---------------- */

const firebaseConfig = {
  apiKey: "AIzaSyC5zrSdUmrrfbT74TLX1lbVpB1M8mPgGiY",
  authDomain: "online-store-3ab02.firebaseapp.com",
  projectId: "online-store-3ab02",
  storageBucket: "online-store-3ab02.firebasestorage.app",
  messagingSenderId: "508936229213",
  appId: "1:508936229213:web:ff3b8d810d172ae46458b4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app); // ✅ FIRESTORE ADDED

/* ---------------- AUTH ---------------- */

window.register = async () => {
  const email = loginEmail.value;
  const pass = loginPassword.value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    alert("Registered!");
  } catch (e) {
    alert(e.message);
  }
};

window.login = async () => {
  const email = loginEmail.value;
  const pass = loginPassword.value;

  try {
    const res = await signInWithEmailAndPassword(auth, email, pass);
    authStatus.textContent = "Logged in: " + res.user.email;
  } catch (e) {
    alert(e.message);
  }
};

window.logout = async () => {
  await signOut(auth);
  authStatus.textContent = "Not logged in";
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    authStatus.textContent = "Logged in: " + user.email;
    email.value = user.email;
  } else {
    authStatus.textContent = "Not logged in";
  }
});

/* ---------------- CART ---------------- */

let cart = [];

window.addToCart = (name, price) => {
  const item = cart.find(i => i.name === name);

  if (item) item.quantity++;
  else cart.push({ name, price, quantity: 1 });

  renderCart();
};

function renderCart() {
  let html = "";
  let total = 0;

  if (cart.length === 0) {
    cartItems.innerHTML = "Empty";
    totalPrice.innerText = "Total: $0";
    return;
  }

  cart.forEach(i => {
    total += i.price * i.quantity;

    html += `
      <div class="cart-item">
        <span>${i.name} x${i.quantity}</span>
        <span>$${i.price * i.quantity}</span>
      </div>
    `;
  });

  cartItems.innerHTML = html;
  totalPrice.innerText = "Total: $" + total;
}

/* ---------------- CHECKOUT (FIRESTORE HERE) ---------------- */

checkoutForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!auth.currentUser) {
    alert("Login first");
    return;
  }

  if (cart.length === 0) {
    alert("Cart empty");
    return;
  }

  let total = 0;

  cart.forEach(i => {
    total += i.price * i.quantity;
  });

  try {
    // ✅ SAVE ORDER TO FIRESTORE
    await addDoc(collection(db, "orders"), {
      uid: auth.currentUser.uid,
      email: auth.currentUser.email,
      name: name.value,
      address: address.value,
      payment: payment.value,
      message: message.value,
      items: cart,
      total,
      createdAt: new Date()
    });

    alert("Order placed!");

    cart = [];
    renderCart();
    checkoutForm.reset();

  } catch (error) {
    console.error(error);
    alert("Failed to save order: " + error.message);
  }
});
</script>
</body>
</html>
