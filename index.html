```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Online Store</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#333;
    }

    header{
      background:#222;
      color:white;
      padding:20px;
      text-align:center;
    }

    .container{
      width:90%;
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:20px;
    }

    .product{
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      text-align:center;
    }

    .product img{
      width:100%;
      height:220px;
      object-fit:cover;
      border-radius:10px;
    }

    .product h3{
      margin:15px 0 10px;
    }

    .price{
      color:green;
      font-size:20px;
      font-weight:bold;
      margin-bottom:10px;
    }

    form{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-top:40px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    form h2{
      margin-bottom:20px;
    }

    input, select, textarea{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:16px;
    }

    button{
      background:#222;
      color:white;
      border:none;
      padding:12px 20px;
      cursor:pointer;
      border-radius:5px;
      font-size:16px;
    }

    button:hover{
      background:#444;
    }

    footer{
      background:#222;
      color:white;
      text-align:center;
      padding:15px;
      margin-top:40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Online Store</h1>
    <p>Simple Shopping Website</p>
  </header>

  <div class="container">

    <h2>Our Products</h2>

    <div class="products">

      <div class="product">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1000&auto=format&fit=crop" alt="Running Shoes">
        <h3>Nike Running Shoes</h3>
        <p class="price">$120</p>
        <p>Comfortable and stylish running shoes for everyday use.</p>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1000&auto=format&fit=crop" alt="Smart Watch">
        <h3>Smart Watch</h3>
        <p class="price">$85</p>
        <p>Track your fitness and notifications with this smart watch.</p>
      </div>

    </div>

    <!-- ORDER FORM -->

    <form id="orderForm">
      <h2>Place Your Order</h2>

      <input type="text" id="name" placeholder="Your Name" required>

      <input type="email" id="email" placeholder="Your Email" required>

      <select id="product" required>
        <option value="">Select Product</option>
        <option value="Nike Running Shoes">Nike Running Shoes</option>
        <option value="Smart Watch">Smart Watch</option>
      </select>

      <input type="number" id="quantity" placeholder="Quantity" min="1" required>

      <textarea id="message" rows="5" placeholder="Additional Message"></textarea>

      <button type="submit">Submit Order</button>
    </form>

  </div>

  <footer>
    <p>© 2026 My Online Store</p>
  </footer>

  <!-- EmailJS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    // Initialize EmailJS
    emailjs.init("YOUR_PUBLIC_KEY");

    document.getElementById("orderForm").addEventListener("submit", function(event){
      event.preventDefault();

      const templateParams = {
        customer_name: document.getElementById("name").value,
        customer_email: document.getElementById("email").value,
        product_name: document.getElementById("product").value,
        quantity: document.getElementById("quantity").value,
        message: document.getElementById("message").value
      };

      emailjs.send(
        "YOUR_SERVICE_ID",
        "YOUR_TEMPLATE_ID",
        templateParams
      )
      .then(function(response){
        alert("Order sent successfully!");
        document.getElementById("orderForm").reset();
      })
      .catch(function(error){
        alert("Failed to send order.");
        console.log(error);
      });
    });
  </script>

</body>
</html>
```
