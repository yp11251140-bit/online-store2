<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>lukewarm beverages</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4;}
header{background:#111;color:#fff;padding:30px;text-align:center;}
.container{width:90%;max-width:1000px;margin:auto;padding:20px;}

.box{background:#fff;padding:20px;margin-top:20px;border-radius:12px;}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;}
.product{background:#fff;padding:10px;border-radius:10px;}

button{padding:8px 12px;border:none;background:#111;color:#fff;border-radius:6px;cursor:pointer;}
button:hover{background:#444;}

.cart-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ddd;}

#totalPrice{font-weight:bold;margin-top:10px;}

input,textarea{width:100%;padding:8px;margin:5px 0;}
</style>
</head>

<body>

<header>
<h1>lukewarm beverages</h1>
</header>

<div class="container">

<!-- AUTH -->
<div class="box">
<h2>Account</h2>

<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<p id="authStatus">Not logged in</p>
</div>

<!-- PRODUCTS -->
<div class="box">
<h2>Products</h2>

<div class="products">
<div class="product">
<h3>Water</h3>
<p>$100</p>
<button onclick="addToCart('Water',100)">Add</button>
</div>

<div class="product">
<h3>Sports Drink</h3>
<p>$50</p>
<button onclick="addToCart('Sports Drink',50)">Add</button>
</div>
</div>
</div>

<!-- CART -->
<div class="box">
<h2>Cart</h2>
<div id="cartItems">Empty</div>
<h3 id="totalPrice">Total: $0</h3>
</div>

<!-- CHECKOUT -->
<div class="box">
<h2>Checkout</h2>

<form id="checkoutForm">
<input id="name" placeholder="Name" required>
<input id="email" placeholder="Email">
<textarea id="message" placeholder="Message"></textarea>
<button type="submit">Place Order</button>
</form>
</div>

<!-- MY ORDERS UI -->
<div class="box">
<h2>My Orders</h2>
<div id="ordersList">Login to see orders</div>
</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyC5zrSdUmrrfbT74TLX1lbVpB1M8mPgGiY",
authDomain: "online-store-3ab02.firebaseapp.com",
projectId: "online-store-3ab02",
storageBucket: "online-store-3ab02.firebasestorage.app",
messagingSenderId: "508936229213",
appId: "1:508936229213:web:ff3b8d810d172ae46458b4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* AUTH */
window.register = async () => {
await createUserWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
};

window.login = async () => {
await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
};

window.logout = async () => {
await signOut(auth);
};

/* AUTH STATE */
onAuthStateChanged(auth, async (user) => {
if (user) {
authStatus.textContent = "Logged in: " + user.email;
email.value = user.email;
loadOrders(user.uid);
} else {
authStatus.textContent = "Not logged in";
ordersList.innerHTML = "Login to see orders";
}
});

/* CART */
let cart = [];

window.addToCart = (name, price) => {
const item = cart.find(i => i.name === name);
if (item) item.quantity++;
else cart.push({ name, price, quantity: 1 });
renderCart();
};

function renderCart() {
let total = 0;

if (cart.length === 0) {
cartItems.innerHTML = "Empty";
totalPrice.innerText = "Total: $0";
return;
}

cartItems.innerHTML = "";

cart.forEach(i => {
total += i.price * i.quantity;

cartItems.innerHTML += `
<div class="cart-item">
<span>${i.name} x${i.quantity}</span>
<span>$${i.price * i.quantity}</span>
</div>`;
});

totalPrice.innerText = "Total: $" + total;
}

/* CHECKOUT */
checkoutForm.addEventListener("submit", async (e) => {
e.preventDefault();

if (!auth.currentUser) return alert("Login first");
if (cart.length === 0) return alert("Cart empty");

for (const item of cart) {
await addDoc(collection(db, "orders"), {
userId: auth.currentUser.uid,
userEmail: auth.currentUser.email,
customerName: name.value,
productName: item.name,
quantity: item.quantity,
price: item.price,
message: message.value,
orderDate: new Date()
});
}

cart = [];
renderCart();
checkoutForm.reset();

loadOrders(auth.currentUser.uid);

alert("Order placed!");
});

/* MY ORDERS UI */
async function loadOrders(uid) {
const snap = await getDocs(collection(db, "orders"));

let html = "";

snap.forEach(doc => {
const o = doc.data();

if (o.userId === uid) {
html += `
<div class="cart-item">
<div>
<strong>${o.productName}</strong><br>
Qty: ${o.quantity} | $${o.price}
</div>
<div>${new Date(o.orderDate.seconds ? o.orderDate.seconds * 1000 : o.orderDate).toLocaleString()}</div>
</div>`;
}
});

ordersList.innerHTML = html || "No orders yet";
}

</script>

</body>
</html>
