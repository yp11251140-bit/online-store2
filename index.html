<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>lukewarm beveras</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4;}
header{background:#111;color:white;padding:25px;text-align:center;}
.container{width:90%;max-width:1000px;margin:auto;padding:20px;}

.box{background:white;padding:15px;margin-top:15px;border-radius:10px;}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.product{background:#fff;padding:10px;border-radius:8px;border:1px solid #ddd;}

button{padding:8px 10px;border:none;background:#111;color:white;border-radius:6px;cursor:pointer;}
button:hover{background:#333;}

.cart-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;}

input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:6px;}

#totalPrice{font-weight:bold;margin-top:10px;}
</style>
</head>

<body>

<header>
<h1>lukewarm beverages</h1>
</header>

<div class="container">

<!-- AUTH -->
<div class="box">
<h2>Account</h2>

<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<p id="authStatus">Not logged in</p>
</div>

<!-- PRODUCTS -->
<div class="box">
<h2>Products</h2>

<div class="products">
<div class="product">
<h3>Water</h3>
<img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcTiu1JwYPCJc-G8_2eJCm61oooWeP11cC4MtztMOGRIax2rV0CnNFtg5F-rN9wPK-OQ7C4_F5ipU-PevRJCxf7UHagOHuh846H8u6oESN2-NJa2VEGmMlAjV4uG98OYP4daFzPYyYw&usqp=CAc" alt="water">
<p>bottled water to drink</p>
<p>$100</p>
<button onclick="addToCart('Water',100)">Add</button>
</div>

<div class="product">
<h3>Sports Drink</h3>
<img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcRQZgvyh7nZR3KRkBE7-o-mxWI6T-hl0yI80BImQZICylKCYibkGSpEwMa94awsbtdf3zthrFjX7cBrGMveseoqTwWgy4tN4nHCEIkXFbKNu6yJT-3dM5G0gCgXsESychV4aWxv2w&usqp=CAc" alt="sports drink">
<p>sports drink for sports</p>
<p>$50</p>
<button onclick="addToCart('Sports Drink',50)">Add</button>
</div>
</div>
</div>

<!-- CART -->
<div class="box">
<h2>Cart</h2>
<div id="cartItems">Empty</div>
<div id="totalPrice">Total: $0</div>
</div>

<!-- CHECKOUT -->
<div class="box">
<h2>Checkout</h2>

<form id="checkoutForm">
<input id="name" placeholder="Name" required>
<textarea id="message" placeholder="Message"></textarea>
<button type="submit">Place Order</button>
</form>
</div>

<!-- MY ORDERS -->
<div class="box">
<h2>My Orders</h2>
<div id="ordersList">Login to see orders</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyC5zrSdUmrrfbT74TLX1lbVpB1M8mPgGiY",
authDomain: "online-store-3ab02.firebaseapp.com",
projectId: "online-store-3ab02",
storageBucket: "online-store-3ab02.firebasestorage.app",
messagingSenderId: "508936229213",
appId: "1:508936229213:web:ff3b8d810d172ae46458b4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* CART */
let cart = [];

window.addToCart = (name, price) => {
const item = cart.find(i => i.name === name);
if (item) item.quantity++;
else cart.push({ name, price, quantity: 1 });
renderCart();
};

function renderCart() {
let total = 0;

if (cart.length === 0) {
cartItems.innerHTML = "Empty";
totalPrice.innerText = "Total: $0";
return;
}

cartItems.innerHTML = "";

cart.forEach(i => {
total += i.price * i.quantity;

cartItems.innerHTML += `
<div class="cart-item">
<span>${i.name} x${i.quantity}</span>
<span>$${i.price * i.quantity}</span>
</div>`;
});

totalPrice.innerText = "Total: $" + total;
}

/* AUTH */
window.register = async () => {
await createUserWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
};

window.login = async () => {
await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
};

window.logout = async () => {
await signOut(auth);
};

onAuthStateChanged(auth, (user) => {
if (user) {
authStatus.textContent = "Logged in: " + user.email;
loadOrders(user.uid);
} else {
authStatus.textContent = "Not logged in";
ordersList.innerHTML = "Login to see orders";
}
});

/* CHECKOUT (FIXED) */
document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
e.preventDefault();

if (!auth.currentUser) return alert("Login first");
if (cart.length === 0) return alert("Cart empty");

const customerName = document.getElementById("name").value;
const messageValue = document.getElementById("message").value;

try {
for (const item of cart) {
await addDoc(collection(db, "orders"), {
userId: auth.currentUser.uid,
userEmail: auth.currentUser.email,

customerName: customerName,
productName: item.name,
quantity: item.quantity,
price: item.price,

message: messageValue,
orderDate: new Date()
});
}

cart = [];
renderCart();
checkoutForm.reset();

loadOrders(auth.currentUser.uid);

alert("Order placed!");

} catch (err) {
console.error(err);
alert(err.message);
}
});

/* MY ORDERS UI */
async function loadOrders(uid) {
const snap = await getDocs(collection(db, "orders"));

let html = "";

snap.forEach(doc => {
const o = doc.data();

if (o.userId === uid) {
html += `
<div class="cart-item">
<div>
<b>${o.productName}</b><br>
Qty: ${o.quantity} | $${o.price}
</div>
<div>
${new Date(o.orderDate?.seconds ? o.orderDate.seconds * 1000 : o.orderDate).toLocaleString()}
</div>
</div>`;
}
});

ordersList.innerHTML = html || "No orders yet";
}

</script>

</body>
</html>
